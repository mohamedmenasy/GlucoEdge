name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: pytest -v

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Build and unit-test the app
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:checkNoInternetPermission :app:checkNativeLibProvenance

  ios:
    runs-on: macos-26
    env:
      # LiteRT's repo keeps Android/Linux prebuilts (unused by its Swift
      # package) in Git LFS, and SwiftPM's mirror lacks those objects for a
      # pinned revision, so `git lfs pull` fails. Fetch no LFS objects.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: lfs.fetchexclude
      GIT_CONFIG_VALUE_0: "*"
    steps:
      - uses: actions/checkout@v4
      - name: No-network source guard
        run: ios/scripts/check_no_network.sh
      - name: Build and test on simulator
        run: |
          xcodebuild test \
            -project ios/GlucoEdge.xcodeproj \
            -scheme GlucoEdge \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO
